<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://script.google.com">
<title>홍성운</title>
<style>
  /*https://sonjava00-lang.github.io/hong/ → hong
https://sonjava00-lang.github.io/hong/?app=memo → 다른 프로젝트
?app=memo&mode=list처럼 뒤에 붙인 값은 그 프로젝트로 그대로 넘어갑니다.

앱을 더 늘리려면 APPS 안에 이름: '주소' 줄만 추가하면 됩니다. 단점은 홈 화면 **”앱 설치"**를 하면 항상 기본(hong)으로 열린다는 점입니다. 
설치 대신 **”홈 화면에 추가"(바로가기)**로 각 주소를 추가하면 되지만, 크롬에서는 주소창이 보일 수 있습니다.*/
html,body{margin:0;height:100%}
iframe{border:0;width:100%;height:100%}
#ld{position:fixed;inset:0;background:#716f7c url(splash.jpg) center/cover no-repeat;
    display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
    font-family:sans-serif;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);
    transition:opacity .3s}
</style>
</head><body>
<div id="ld">불러오는 중…</div>
<iframe id="f" style="visibility:hidden"></iframe>
<script>
var APPS = {
  hong:  'https://script.google.com/macros/s/AKfycbxFm4KCYpZ96tiIl8ycSW8awWXdaUQNxHlQrvoQtMpvvuJTE9e9PyVepeFsTzvBMDjO/exec',
  memo:  'https://script.google.com/macros/s/다른프로젝트ID/exec'
};

var q = new URLSearchParams(location.search);
var app = q.get('app') || 'hong';
if (!APPS[app]) app = 'hong';
q.delete('app');
if (app === 'hong' && !q.has('mode')) q.set('mode', 'hong');

var f = document.getElementById('f');
f.onload = function () {
  f.style.visibility = 'visible';
  var ld = document.getElementById('ld');
  ld.style.opacity = 0;
  setTimeout(function () { ld.style.display = 'none'; }, 300);
};
var qs = q.toString();
f.src = APPS[app] + (qs ? '?' + qs : '');

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body></html>
